[/Script/Pavlov.DedicatedServer]
; Server key: set SERVER_KEY in .env (inserted here on start), or add
; ServerKey=<your server key> below.
bEnabled=true
; About 35 characters max. A profanity filter can hide the server.
ServerName="Docker Shack Server"
; Shack caps at 24 players; 10 or fewer is recommended.
MaxPlayers=10
bSecured=true
bCustomServer=true
bVerboseLogging=false
bEnableBots=false
; Competitive only works for SND.
bCompetitive=false
bWhitelist=false
; Seconds between re-reading the ban, whitelist and mod files.
RefreshListTime=120
; 0 unlimited, 1 limited generic, 2 limited specific, 3 custom (map), 4 limited special, 5 boxless
LimitedAmmoType=0
; Leave at 90 unless you know why: it changes despawn times and breaks some modes.
TickRate=90
; Minutes per map, only for TDM/DM-style modes.
TimeLimit=60
; Idle kick in seconds, 0 disables it.
AFKTimeLimit=300
;Password=0000
;BalanceTableURL="vankruptgames/BalancingTable/main"

; One line per map, played in order. Modes: DM, KOTH, GUN, OITC, SND, TANKTDM,
; TDM, TTT, TTTclassic, WW2GUN, ZWV, HIDE, INFECTION, PUSH, PH.
; Shack-only stock maps: ogcontainers, haguenau, foundation.
; mod.io maps: MapId="UGC<resource id>"; the server downloads them into Saved/maps.
MapRotation=(MapId="datacenter", GameMode="TDM")
MapRotation=(MapId="sand", GameMode="TDM")
MapRotation=(MapId="ogcontainers", GameMode="TDM")
MapRotation=(MapId="santorini", GameMode="TDM")
;MapRotation=(MapId="UGC2773760", GameMode="DM")
