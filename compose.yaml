# Pavlov Shack (Quest) dedicated server for Podman.
#   cp .env.example .env      # then edit .env and config/Game.ini
#   podman compose up -d --build
#   podman compose logs -f
name: pavlov-shack

services:
  pavlov:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/pavlov-shack:latest
    # The server binaries are x86_64 only.
    platform: linux/amd64
    container_name: pavlov-shack
    restart: unless-stopped
    environment:
      STEAM_BRANCH: ${STEAM_BRANCH:-shack}
      GAME_PORT: ${GAME_PORT:-7777}
      QUERY_PORT: ${QUERY_PORT:-8177}
      RCON_PORT: ${RCON_PORT:-9100}
      RCON_PASSWORD: ${RCON_PASSWORD:-}
      SERVER_KEY: ${SERVER_KEY:-}
      UPDATE_ON_START: ${UPDATE_ON_START:-true}
      VALIDATE: ${VALIDATE:-false}
    # Extra PavlovServer.sh arguments, e.g. competitive mode:
    # command: ["-COMPETITIVE=1"]
    ports:
      # Game port and the port 400 above it. UDP for play, TCP so Shack
      # clients can download mod.io maps from the server.
      - "${GAME_PORT:-7777}:${GAME_PORT:-7777}/udp"
      - "${GAME_PORT:-7777}:${GAME_PORT:-7777}/tcp"
      - "${QUERY_PORT:-8177}:${QUERY_PORT:-8177}/udp"
      - "${QUERY_PORT:-8177}:${QUERY_PORT:-8177}/tcp"
      # RCON (TCP). Bound to localhost unless RCON_BIND says otherwise.
      - "${RCON_BIND:-127.0.0.1}:${RCON_PORT:-9100}:${RCON_PORT:-9100}/tcp"
    volumes:
      # Server install, logs, downloaded maps and runtime config.
      - pavlov-server:/home/steam/pavlovserver
      # Game.ini, mods.txt, blacklist.txt, whitelist.txt (read-only, copied in on start).
      - ./config:/config:ro,z
    stop_grace_period: 30s

  # Web manager (management/): sign in with RCON_PASSWORD at http://localhost:8080.
  # Talks to RCON over the compose network, so RCON needn't be published on the host.
  manager:
    build:
      context: ./management
      dockerfile: Dockerfile
    image: localhost/pavlov-manager:latest
    container_name: pavlov-manager
    restart: unless-stopped
    depends_on:
      - pavlov
    environment:
      Rcon__Host: pavlov
      Rcon__Port: ${RCON_PORT:-9100}
      # Set to true behind a reverse proxy (TLS) so the login throttle sees client IPs.
      TrustForwardedHeaders: ${MANAGER_TRUST_PROXY:-true}
    ports:
      # 127.0.0.1 = this machine only. MANAGER_BIND=0.0.0.0 opens it to your network (plain HTTP).
      - "${MANAGER_BIND:-127.0.0.1}:${MANAGER_PORT:-8118}:8080"

volumes:
  pavlov-server:
